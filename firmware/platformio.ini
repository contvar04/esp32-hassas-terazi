; Ana firmware: Wi-Fi/tablet ve 20x4 LCD.
; HX711 bagli degilken sensor hatasi gorunur; sahte agirlik uretilmez.
[platformio]
default_envs = terazi_main
src_dir = .

[env:terazi_main]
platform = espressif32@7.1.1
board = esp32dev
framework = arduino
lib_deps =
    bogde/HX711@0.7.5
    mathertel/LiquidCrystal_PCF8574@2.3.0
build_src_filter = +<*> -<tests/> -<tools/>
upload_speed = 115200
monitor_speed = 115200
