; Ilk donanim kontrolu: yalniz HX711 ham ADC testi.
; DT -> GPIO16, SCK -> GPIO4. Gerilim uyumu donanimda dogrulanmalidir.
[platformio]
default_envs = hx711_raw
src_dir = examples/hx711_raw_test

[env:hx711_raw]
platform = espressif32@7.1.1
board = esp32dev
framework = arduino
lib_deps = bogde/HX711@0.7.5
build_src_filter = +<*> -<tests/>
upload_speed = 115200
monitor_speed = 115200
